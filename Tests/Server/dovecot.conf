# Dovecot 2.3 for Tests/Server: plain IMAP on 127.0.0.1:10143, any user name, password "secret".
# Started by .github/workflows/tests.yml, which fills in RUN_DIR (short: it holds sockets), MAIL_DIR and MAIL_USER.
protocols = imap
listen = 127.0.0.1
base_dir = RUN_DIR
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
log_path = MAIL_DIR/dovecot.log
mail_location = maildir:MAIL_DIR/%u/Maildir:LAYOUT=fs
mail_uid = MAIL_USER
mail_gid = MAIL_USER
first_valid_uid = 1
passdb {
  driver = static
  args = password=secret
}
userdb {
  driver = static
  args = uid=MAIL_USER gid=MAIL_USER home=MAIL_DIR/%u
}
namespace inbox {
  inbox = yes
  separator = /
}
service imap-login {
  inet_listener imap {
    port = 10143
  }
}
